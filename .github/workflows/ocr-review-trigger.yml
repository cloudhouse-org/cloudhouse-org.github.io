name: Organization OpenCodeReview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to review
        required: true
        type: number

permissions: {}

jobs:
  review:
    uses: cloudhouse-org/.github/.github/workflows/ocr-review.yml@c3d55d6ae51e427cab94f1eb68dc106c78cd7789
    with:
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    secrets: inherit
